<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Trainer Management System')}"></head>
<body class="dark-body">

<main class="page-shell">
    <h1 class="page-title">Trainer Management System</h1>

    <!-- Search bar -->
    <div class="page-toolbar">
        <form method="get" th:action="@{/manager/dashboard}" class="search-inline">
            <input type="text" name="keyword" placeholder="Search by name or role..."
                   th:value="${keyword}">
            <button class="btn neon-soft" type="submit">Search</button>
            <a th:href="@{/manager/dashboard}" class="btn btn-outline-small">Clear</a>
        </form>

        <div class="toolbar-right">
            <button type="button" id="openAddTrainer" class="btn neon-small">
                + Add Trainer
            </button>

            <a th:href="@{/manager/delete-all}" class="btn danger-small"
               onclick="return confirm('Delete ALL trainers?')">Delete All</a>
        </div>
    </div>

    <section class="dark-card">
        <table class="table-clean">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Salary</th>
                <th>Role</th>
                <th style="text-align:center;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${trainers}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.fullName}"></td>
                <td th:text="${t.email}"></td>
                <td th:text="${t.phone}"></td>
                <td th:text="${t.gender}"></td>
                <td th:text="${t.salary}"></td>
                <td th:text="${t.role}"></td>
                <td class="table-actions">

                    <a th:href="@{|/manager/edit/${t.id}|}" class="btn btn-outline-small">Edit</a>

                    <!-- DELETE: Calls /manager/delete/{id} -->
                    <a th:href="@{|/manager/delete/${t.id}|}" class="btn danger-small"
                       onclick="return confirm('Remove this trainer?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>


    <div id="addTrainerModal" class="modal-overlay" style="display:none;">
        <div class="modal-window">
            <h2 class="card-title"
                th:text="${trainer} != null ? 'Edit Trainer' : 'Add Trainer'">
                Add Trainer
            </h2>

            <form th:action="@{/manager/save}" method="post" class="form-grid">

                <input type="hidden" name="id" th:value="${trainer != null} ? ${trainer.id} : ''"/>

                <input type="text" name="fullName" placeholder="Full Name"
                       th:value="${trainer != null} ? ${trainer.fullName} : ''"
                       required>

                <input type="email" name="email" placeholder="Email"
                       th:value="${trainer != null} ? ${trainer.email} : ''"
                       required>

                <input type="text" name="phone" placeholder="Phone"
                       th:value="${trainer != null} ? ${trainer.phone} : ''">

                <input type="text" name="gender" placeholder="Gender"
                       th:value="${trainer != null} ? ${trainer.gender} : ''">

                <input type="number" step="0.01" name="salary" placeholder="Salary"
                       th:value="${trainer != null} ? ${trainer.salary} : ''">

                <input type="text" name="role" placeholder="Role / Specialty"
                       th:value="${trainer != null} ? ${trainer.role} : ''">

                <div class="form-actions-wide">
                    <button class="btn neon" type="submit">Save</button>
                    <button type="button" id="closeAddTrainer" class="btn btn-outline-small">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Back to home -->
    <div style="margin-top: 2rem; text-align: center;">
        <a th:href="@{/}" class="btn neon" style="padding: 0.8rem 2rem;">
            ← Back to Home
        </a>
    </div>
</main>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const modal = document.getElementById('addTrainerModal');
        const openBtn = document.getElementById('openAddTrainer');
        const closeBtn = document.getElementById('closeAddTrainer');

        if (openBtn && modal) {
            openBtn.addEventListener('click', () => modal.style.display = 'flex');
        }
        if (closeBtn && modal) {
            closeBtn.addEventListener('click', () => modal.style.display = 'none');
        }

        // ако има избран trainer (EDIT), отваряме модала автоматично
        const hasTrainer =
            /*[[${trainer} != null]]*/ false;

        if (hasTrainer && modal) {
            modal.style.display = 'flex';
        }
    });
</script>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
