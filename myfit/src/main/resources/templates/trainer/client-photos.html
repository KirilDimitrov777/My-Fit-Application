<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Client Photos')"></head>
<body class="dark-body">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-container">

    <a href="/trainer/dashboard" class="btn neon"
       style="margin-bottom: 20px; display: inline-block;">
        ← Back to Dashboard
    </a>

    <h1 class="main-title">Progress Photos of <span th:text="${client.fullName}"></span></h1>

    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:20px;">
        <img th:each="photo : ${photos}"
             th:src="${photo.filePath}"
             style="width:250px; border-radius:10px;">
    </div>

</div>

</body>
</html>
