<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Trainer Chat')}"></head>
<body class="dark-body">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell chat-page">
    <h1 class="page-title">Chat with Client</h1>

    <section class="dark-card">
        <!-- История от базата -->
        <div id="chatBox" class="chat-box">
            <div th:each="m : ${messages}"
                 th:class="'msg ' + (${m.sender} == 'TRAINER' ? 'msg-right' : 'msg-left')">
                <div class="bubble">
                    <span th:text="${m.text}"></span>
                </div>
                <div class="time"
                     th:text="${#temporals.format(m.timestamp, 'HH:mm dd.MM')}"></div>
            </div>
        </div>

        <!-- Класическа POST форма (ползва /trainer/chat/send от TrainerController) -->
        <form th:action="@{/trainer/chat/send}" method="post"
              class="chat-input-row" style="display:flex;gap:10px;margin-top:10px;">
            <input type="hidden" name="assignmentId" th:value="${assignmentId}">
            <input type="hidden" name="clientId" th:value="${clientId}">
            <input type="hidden" name="trainerId" th:value="${trainerId}">

            <input type="text" name="text" class="input"
                   placeholder="Type a message..." required>
            <button class="btn neon" type="submit">Send</button>
        </form>

        <a th:href="@{/trainer/dashboard}" class="btn back-btn" style="margin-top:10px;">⬅ Back</a>
    </section>
</main>

<!-- Auto scroll до долу при отваряне -->
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const box = document.getElementById('chatBox');
        if (box) {
            box.scrollTop = box.scrollHeight;
        }
    });
</script>

</body>
</html>
