<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Questionnaire')}"></head>
<body class="dark-body">
<div class="form-container">
    <h2>Client Questionnaire</h2>

    <form th:action="@{/client/questionnaire}" method="post">
        <input type="hidden" name="clientId" th:value="${clientId}">

        <input type="text" name="goal" placeholder="Your Goal (lose fat, build muscle...)" required>
        <input type="text" name="experienceLevel" placeholder="Training experience (beginner / intermediate / advanced)">
        <textarea name="healthNotes" placeholder="Injuries / health notes"></textarea>
        <input type="number" step="0.1" name="weight" placeholder="Weight (kg)">
        <input type="number" step="0.1" name="height" placeholder="Height (cm)">

        <button type="submit" class="btn neon">Continue</button>
    </form>
</div>
</body>
</html>
